name: modern-sorting-ci

on:
  push:
    branches:
      - feature/modern-sorting-research
  pull_request:
    paths:
      - "sorting/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/modern-sorting-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build sorting library
        run: dotnet build sorting/sorting/sorting.csproj -c Release

      - name: Run modern C# smoke tests
        run: dotnet run --project sorting/tests/SortingSmoke/SortingSmoke.csproj -c Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Run reference benchmark tests
        run: python -m unittest tests/test_sorting_benchmarks.py
